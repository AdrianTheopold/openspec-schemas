name: superpowers-bridge
version: 1
description: >
  Spec-driven workflow integrated with Superpowers skills.
  Requirements: Superpowers plugin installed, providing skills:
  brainstorming, writing-plans, using-git-worktrees,
  subagent-driven-development, finishing-a-development-branch.
  Requires a subagent-capable platform (Claude Code, Codex, etc.) —
  this schema does not support runtimes without subagent support,
  because the alternative executor (executing-plans) runs every task
  in one context with no per-task review — it keeps TDD and one final
  whole-branch review but drops the fresh context and the review gate
  per task that this schema's apply phase is built on.
  If your platform lacks subagent support, use spec-driven instead.
  Each artifact / apply step that invokes a Superpowers skill
  PRECHECKs it and STOPs with a clear error if it is missing; the one
  OpenSpec skill used (openspec-verify-change) deliberately has a
  documented manual fallback instead of a STOP.
  brainstorm → proposal → specs, with design branching from brainstorm
  in parallel; specs + design → tasks → plan → verify → retrospective.
  design is required (reorganizes raw brainstorm output into structured
  Context / Goals / Decisions / Risks / Migration; referenced by tasks
  and plan for implementation guidance).
  Apply phase uses git worktrees + subagent-driven-development
  (a fresh implementer and a fresh reviewer per task, and a final
  whole-branch review); TDD reaches each task through the plan's
  test-first steps, which the plan artifact requires.

artifacts:
  - id: brainstorm
    generates: brainstorm.md
    description: Collaborative design exploration using Superpowers brainstorming
    template: brainstorm.md
    instruction: |
      PRECHECK — required skill availability:
      Before invoking, confirm `superpowers:brainstorming` appears in
      your available skills list. If missing, STOP and inform the user
      that the Superpowers plugin must be installed (or that they can
      explicitly opt to write brainstorm.md manually using the template
      below). Do NOT silently fall back.

      Use the Skill tool to invoke **superpowers:brainstorming**.

      Sizing (Superpowers 7.0.0+): once the skill understands the
      request it sizes the work in plain words as a quick, clear task
      (just do it), a small change (description in chat, then build) or
      a project with a written design (a design document, then a full
      plan). Inside this schema the answer is fixed: a change that
      reached this artifact already passed the bridge's entry gate
      (README § Entry & exit gates), so size it as a project with a
      written design and follow that path. Do NOT take the quick-task
      or small-change exit — the artifacts downstream of this one ARE
      the written design and plan. If brainstorming itself concludes
      the work is a quick task or a small change, that is a signal to
      leave the schema for a direct PR, not to shortcut inside it. A
      spike the user agrees to stays throwaway learning; it does not
      replace the written design.

      Skip exit closed: the skill's first message normally offers to
      skip the questions and just start, and taking that offer ends the
      skill with no document. That exit does not exist in this flow,
      because this artifact must end in a written design — leave the
      offer out of the first message. A user who wants no questions
      takes the manual path from the PRECHECK above (they write
      brainstorm.md from the template), not a skill run that ends with
      nothing to capture.

      Handoff stops here: after the design is approved the skill's next
      step is writing-plans. In this schema the plan is a later
      artifact (after proposal, specs, design and tasks), so this
      artifact ends at the approved design — do NOT invoke
      writing-plans from it.

      IMPORTANT output redirection:
      - Do NOT write to `docs/superpowers/specs/`. Instead, write the
        brainstorming output directly to this change's `brainstorm.md`.
      - brainstorm.md is a RAW CAPTURE — write the brainstorming
        skill's full output as-is, without forcing any template
        structure. In Superpowers 7.0.0 the skill's natural output is
        a written design (intent and the why; goals, non-goals and
        anti-goals; constraints; the parts of the how the user decided;
        what is left to the builder, with the agent's own calls marked
        as such); earlier versions produced a decision log (background
        → decision chain Q1-Qn → design trade-offs). The format varies
        by conversation. Preserve the skill's natural organization.
      - Do NOT pre-fill design.md during this step. design.md is a
        separate artifact that reorganizes brainstorm.md content into
        structured sections (Context, Goals, Decisions, Risks,
        Migration). That transformation happens in the design step.

      The brainstorming skill will:
      1. Ask open questions, one per message, about what the user wants
         and why (offering to look at the codebase when that would help)
      2. Weigh several approaches privately, showing a comparison only
         when it helps the user decide
      3. Play the design back as it goes, in chunks of about 200-300
         words, each ending by asking what is wrong or missing
      4. Size the work (here: a project with a written design)
      5. Write the design, have a fresh builder-check subagent read it,
         and bring back, once, only the questions the user alone can
         answer
      6. Hand over the written design for the user's approval — nothing
         downstream starts before that approval
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document based on the brainstorming output.

      Read brainstorm.md for the validated design. Extract:
      - **Why**: The motivation (from brainstorming discussion)
      - **What Changes**: Specific changes agreed upon. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior (for example, `user-auth`), not the work in this change (for example, `add-login-endpoint`). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities. Use kebab-case for path segments you introduce (e.g. `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Since brainstorming already explored the problem space,
      this should be a concise extraction, not a new exploration.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling it in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related — that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Keep `--type spec`: a change
      and a spec sharing a name is otherwise an ambiguous-item error, and
      `openspec list` without `--specs` lists in-flight changes, never what the
      project already covers. Reuse an existing capability's exact path instead
      of introducing a near-duplicate name. The filtered read is only an
      overview: before deciding what is already covered, read each relevant spec
      in full, scenarios included, with `openspec show "<spec-id>" --type spec`.
      This is the spec-level twin of the plan artifact's reuse check — that one
      asks what code a `Create:` entry duplicates; this asks what capability a
      new spec duplicates.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use it only when no spec-level behavior changes (pure
      refactor, tooling, docs) — specs describe behavior, so if behavior does
      not change, no spec should change either. Do not invent a requirement
      just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how".
    requires:
      - brainstorm

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md, tasks.md or plan.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta — a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, compare the capabilities the proposal lists
        with the `specs/<capability-path>/spec.md` files that already exist,
        and start with the first capability that has no file. Do not rewrite
        an existing file unless the user asks you to.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it. Do not plan every file
        before writing the first.
      - Stop when every capability the proposal lists has its file.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) — `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` flags longer descriptions in ADDED requirements and in the main spec. This is a warning: normal validation still passes, but `openspec validate --strict` fails on it. When writing a new requirement, state one behavior per requirement: move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep the existing requirement block whole; never split, trim or rewrite existing text just to meet the length. Split an existing long requirement only when the user asks for it, in a change made for that purpose: under MODIFIED, keep its header and every scenario and cut its description down to one behavior without changing its meaning, then add each behavior you removed as its own ADDED requirement with its own scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` —
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability —
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose, including a leftover `TBD` placeholder,
      edit `openspec/specs/<capability-path>/spec.md` directly.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `openspec/specs/<capability-path>/spec.md`
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      A MODIFIED block replaces the whole requirement at archive time, so it MUST
      still carry every scenario the main spec has that this change does not
      deliberately remove. `openspec validate` errors on a MODIFIED block that
      omits one, and archive refuses rather than dropping scenarios silently. To
      drop a scenario on purpose, keep the block complete and state the removal
      in the proposal's What Changes.

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document explaining HOW to implement the change.

      Read brainstorm.md as input. brainstorm.md is a raw capture of
      the brainstorming skill's output (a written design with intent,
      goals, constraints and the decided how since Superpowers 7.0.0;
      a decision log with Q1-Qn decisions, trade-offs, and context
      before that). Your job is to REORGANIZE that content into the
      structured sections below.

      This is a transformation, not a copy. Extract and restructure:
      - Decisions (Q1-Qn, or the parts of the how the user decided)
        → design.md §Decisions. Keep a choice the brainstorm marks as
        the agent's own call marked that way — it is not something the
        user agreed to.
      - Background/context, constraints → design.md §Context
      - Trade-offs → design.md §Risks / Trade-offs
      - Goals / non-goals / anti-goals → design.md §Goals / Non-Goals
      - Add Migration Plan, and Goals/Non-Goals when the brainstorm has
        none (may require inference from brainstorm.md content)

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g. "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered per decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.
      brainstorm.md usually already holds the answer; a question that survived
      brainstorming unresolved is a signal to go back to the user, not forward.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and the specs for requirements - if a section
      would only restate them, point to them instead.
      Good design docs explain the "why" behind technical decisions.
    requires:
      - brainstorm

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below for tracked tasks.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all. (This bridge's
      `[~]` deferral marker belongs in plan.md's step boxes only; in tasks.md
      it reads as unfinished.)

      Guidelines:
      - Group related tracked tasks under ## numbered headings
      - Each tracked task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Track implementation and verification work that can be completed before
        archive. Do not add tracked tasks for this schema's post-implementation
        steps — verify, retrospective, archive, and finishing the branch are
        apply steps 3-6 and are sequenced there; a tracked task that can only
        be ticked after archive keeps verify's task-completion check from ever
        passing. To keep them visible, list them as plain bullets in an
        optional `## Workflow follow-up` section at the end of tasks.md. These
        bullets are reference information outside tracked task progress.
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Each task group MUST land the tests and documentation its own work
        calls for. Do NOT collect testing or documentation into a final group -
        when a late group first exercises work from an early one, the failures
        cascade back through every group in between and force rework. A group
        whose work calls for neither, such as scaffolding or dependency setup,
        carries neither. A final group is for integration checks only, not for
        the tests and docs an earlier group owed.

      Example:
      ```
      # Tasks

      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      - [ ] 2.3 Document the export API in docs/export.md and verify the documented command runs as written
      ```

      When applicable, append workflow follow-up as plain bullets, for example:
      ```
      ## Workflow follow-up

      - Archive the change after verify and the retrospective (apply steps 3-5).
      - Open the PR/MR via finishing-a-development-branch (apply step 6).
      ```

      tasks.md is the coarse ledger; plan.md (next artifact) breaks each task
      into micro-steps for the executor. Keep tasks at the "one reviewable
      unit" grain and leave the step-by-step to plan.md.

      Reference specs for what needs to be built and design.md for
      how to build it (architecture decisions, trade-offs, migration).
    requires:
      - specs
      - design

  - id: plan
    generates: plan.md
    description: Micro-task implementation plan using Superpowers writing-plans
    template: plan.md
    instruction: |
      PRECHECK — required skill availability:
      Before invoking, confirm `superpowers:writing-plans` appears in
      your available skills list. If missing, STOP and inform the user
      that the Superpowers plugin must be installed (or that they can
      explicitly opt to write plan.md manually using the template
      below). Do NOT silently fall back.

      Use the Skill tool to invoke **superpowers:writing-plans**.

      IMPORTANT output redirection:
      - Do NOT write to `docs/superpowers/plans/`. Instead, write
        the plan directly to this change's `plan.md`.

      The writing-plans skill will:
      1. Read the tasks.md and design.md for context
      2. Break each task into steps that are one action with a
         checkable result each, in TDD order (failing test, run it,
         implement, run it, commit)
      3. Give exact file paths, exact signatures, test code carrying
         the spec's values, and each check's command with its expected
         output; a function body appears only for an algorithm the
         signature and tests do not determine (Superpowers 6.4.2+)
      4. Add commit points after each task

      Test-first steps are required, not just expected: every task that
      adds or changes behavior MUST open with a step that writes the
      failing test and a step that runs it and expects it to fail,
      before any implementation step. This is how TDD reaches apply —
      subagent-driven-development does not load test-driven-development
      itself; its implementer writes tests "following TDD if task says
      to", so a task without those steps is implemented without TDD.
      A task with no behavior to test (pure scaffolding or config)
      says so in one line instead.

      Pass the tasks.md content to the skill as the input for
      decomposition. The plan should reference the specs and
      design artifacts in this change directory.

      Note (Superpowers 6.x): writing-plans emits a "## Global
      Constraints" block and per-task "Interfaces" blocks; the
      implementer MUST honor both. Since 6.4.1 it also emits a
      "## Review Focus" section — the input classes or failure modes
      the spec implies but no task's tests exercise — and adds a test
      for each line to the task that owns the code.

      Global Constraints this schema adds — writing-plans emits the
      section; fill it with these as well:
      (a) This line, verbatim:
          Code comments, docstrings and messages state the reason in words. They cite no planning labels — design decisions (D9), task or step numbers (Task 5, Step 2), review fix tags (FIX-2) or change-folder files (design.md, plan.md). Where a comment needs its source, it names the change: "decision D9 of the change <change-name>". Commit messages carry the trace.
      (b) If these instructions carry `rules` for this artifact, each
          rule in the form it is given: a rule given as text goes in
          as that text; a rule given as a pointer goes in as the
          pointer plus "load it before your first action". Never copy
          the pointed-to content into plan.md — it is tracked in the
          repository, and a copy ages while its source moves on. With
          no `rules`, add nothing and no empty heading.
      (c) Every commit step in the plan ends its message with the
          trailer `Refs: <change-name> decision D<n>; task <n>`, so the
          commit, not the code, links the work to its decision and task.
      These go in the plan because subagent-driven development copies
      each task's section of plan.md verbatim into the implementer's
      brief and fills the task reviewer's constraint slot from Global
      Constraints. That makes the plan the channel that reaches the
      subagent that acts, where an instruction to the controller alone
      arrives only if the controller passes it on.

      Execution handoff (Superpowers 6.4.1+): after its self-review,
      writing-plans asks the user to review the plan and, unless an
      execution method was already supplied, to choose Subagent-driven
      or Native (Native is executing-plans). In this schema the method
      IS already supplied — subagent-driven development, run by the
      apply phase — so take the skill's "already supplied" branch: ask
      the user to review the plan and confirm it captures what they
      want, and do not offer the choice. This artifact ends at that
      review; implementation starts at apply, not here.

      Spec header (Superpowers 6.3.0+): writing-plans opens the plan
      with a `**Spec:**` line naming the document the plan argues from,
      and subagent-driven-development reads it as the binding authority
      for its rulings — a plan with no reachable spec gets a ledger note
      and every ruling made under it is provisional. Fill it with this
      change's artifacts: `openspec/changes/<change-name>/specs/` (the
      delta specs) and `openspec/changes/<change-name>/design.md`. Never
      leave it blank and never point it at `docs/superpowers/specs/`.

      Reuse check — this schema adds it because writing-plans does not.
      That skill's Self-Review runs five checks (spec coverage, step
      scan, type consistency, Review Focus, proportion) and every one
      compares the plan to the spec or to itself; none compares it to
      the codebase. So a
      plan can be flawless against its spec and still instruct someone
      to build what the repo already has.

      Before the plan is final, for EVERY "Create:" entry: search this
      repo and its sibling repos for code that already does that job.
      Then either reuse it, or write into the plan which existing code
      you found and why it is not reused. Name what you searched — an
      unnamed search did not happen.

      A "Create:" entry is where a duplicate gets locked in. "Modify:"
      entries invite the question naturally, because you must find the
      file first; creating feels like it carries no prior-art question
      at all. And once the entry is in the plan it reads as settled, so
      neither the implementer nor the reviewer asks again. Design, plan
      and apply each add authority without adding verification, and the
      duplicate becomes harder to see the further it travels.
    requires:
      - tasks

  - id: verify
    generates: verify.md
    description: Post-implementation verification against specs, design, and tasks
    template: verify.md
    instruction: |
      PRECHECK — implementation evidence:
      (Substitute <change-name> in the commands below with this
      change's directory name before running them.)
      Before producing verify.md, run all three commands. If any
      returns 0, STOP and tell the user that apply phase has not
      yet produced reviewable changes.

      1. Commit evidence (must return > 0):
         git log --oneline $(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD origin/master 2>/dev/null || git merge-base HEAD origin/HEAD 2>/dev/null || git merge-base HEAD main 2>/dev/null || git merge-base HEAD master 2>/dev/null)..HEAD | wc -l

      2. Task progress (must return > 0):
         grep -cE '^\s*([-*+]|[0-9]{1,9}[.)])\s*\[\s*[xX]\s*\]([^([]|$)' openspec/changes/<change-name>/tasks.md

      3. Step progress (must return > 0):
         grep -cE '^\s*([-*+]|[0-9]{1,9}[.)])\s*\[\s*[xX~]\s*\]([^([]|$)' openspec/changes/<change-name>/plan.md

      A 0 from command 2 or 3 means the apply executor failed to maintain that
      ledger as tasks cleared — see apply step 2's ticking rule. On a
      genuinely-complete apply, a 0 is a bookkeeping miss, not
      incomplete work: tick the boxes, then re-run. Both files are
      gated because a rule that names one of them gets followed for
      that one and missed for the other, and an unmaintained plan.md
      silently disarms check 7 below (it counts `[~]` rows that were
      never written). Command 3 accepts `[x]` or `[~]`, so a plan whose
      steps were all deferred still passes — deferral is a recorded
      outcome, not a missing one. Both patterns mirror what OpenSpec
      (1.14.3) counts as a done box: `x` or `X` with any spacing inside
      the brackets, after a `-`, `*`, `+` or `1.` / `1)` marker.

      Only after all three return positive numbers, proceed to invoke
      the verification skill below.

      Use the Skill tool to invoke **openspec-verify-change** (the
      `/opsx:verify` slash command is its user-facing equivalent).

      IMPORTANT timing note:
      - Unlike other artifacts, verify.md is produced AFTER the apply
        phase completes, NOT during planning. The `requires: [plan]`
        edge exists only for schema graph purposes — the actual
        verification step MUST run on a completed implementation.

      The verify step MUST perform the following checks and record
      results in verify.md using the template:

      1. **Structural validation**: Run `openspec validate --all --json`
         in the repository root and confirm every item returns
         `"valid": true`. If any item fails, record the issues and
         return to fix the underlying artifact before proceeding.

      2. **Task completion**: Confirm every checkbox in BOTH committed
         ledgers — tasks.md and plan.md — is `- [x]` (or `- [~]` for a
         deliberately deferred plan.md step). For any `- [ ]`
         remaining in either file, document the reason (e.g. manual /
         out-of-scope / blocked) and whether it blocks archive. Report
         the two files separately: an all-unchecked plan.md beside a
         fully-ticked tasks.md is the signature of a bookkeeping miss
         rather than unfinished work, and it means check 7's `[~]`
         count cannot be trusted.

      3. **Delta spec sync state**: For each directory under
         `openspec/changes/<name>/specs/`, compare against the
         corresponding `openspec/specs/<capability>/spec.md` and
         record one of:
         - ✓ Already synced
         - ✗ Needs sync (list the capabilities)
         - N/A (no delta specs produced)

      4. **Design/specs coherence**: Spot-check that design.md
         decisions reference or align with the requirements listed
         in specs/. Record any drift as a warning (non-blocking).
         Include the executor's "Rulings I made" list (apply step 2)
         in this check: a ruling that alters spec-level behavior is
         drift — blocking until the delta spec is amended to match or
         the ruling is reversed in code; every other ruling is recorded
         here so retrospective §3 can pick it up.

      5. **Implementation signal**: Confirm all code changes are
         committed (no unstaged files in the worktree). Cite the
         commit range if known.

      6. **Front-door routing leak detector** (warning, non-blocking):

         For projects using superpowers-bridge, neither design nor
         plan output should land under `docs/superpowers/` — the
         brainstorm artifact's output redirection (see this schema's
         brainstorm.instruction) routes design output to
         `openspec/changes/<name>/brainstorm.md`, and the plan
         artifact's redirection routes the plan to
         `openspec/changes/<name>/plan.md`. Check BOTH redirected
         paths: a detector watching only one reports clean while the
         other leaks. Run:

           ls docs/superpowers/specs/*.md docs/superpowers/plans/*.md 2>/dev/null

         If any files exist, record a WARNING: "Front-door routing
         leak — design output found at docs/superpowers/specs/...;
         these belong in openspec/changes/<name>/brainstorm.md or
         design.md. Move/delete after confirming content is captured
         in the change directory."

         Non-blocking — adopters may have legitimate non-schema use
         of that directory predating schema install. Surfaces the
         leak so the user can decide whether to clean up.

      7. **Deferred dogfood vs automated-test equivalence**:

         If plan.md has any tasks marked `[~]` deferred (manual smoke /
         dogfood / live-environment checks that weren't run in this
         cycle), enumerate each in verify.md §7 and identify the
         equivalent automated test that covers the same assertions.

         If no equivalent automated test exists for a deferred manual
         check, that row is a real coverage gap — record in
         retrospective Misses with a follow-up plan, not silently
         deferred.

         The decision table makes "deferred-but-covered" vs "deferred-
         and-gapped" visible at archive time, so reviewers can audit
         completeness without re-deriving the rationale from plan +
         test files.

         Non-blocking on its own — Overall Decision remains PASS even
         with identified gaps, provided they're recorded as follow-up.
         Blocks only if §7 is empty AND plan.md has `[~]` rows (means
         the gap analysis was skipped, not that gaps don't exist).

         A blank §7 is only evidence of "nothing deferred" if plan.md
         was actually maintained during apply (see apply step 2's
         ticking rule). Before concluding no deferrals, confirm
         plan.md's step boxes reflect the work: an all-unchecked
         plan.md means the ledger was never maintained, so the absence
         of `[~]` rows says nothing about whether steps were deferred.
         In that case, reconstruct the deferral state from the SDD
         ledger and the commits, tick plan.md to match, and re-run.

      8. **Spec review**: Review the change's delta specs against the
         bundle's rule file, found at `<path>/spec-review.md`, where
         `<path>` is the `path` field of
         `openspec schema which superpowers-bridge --json` — the same
         lookup the spec template's note uses. The rule file holds the
         rules, the clearing
         rules and the report format; this check does not restate them.

         Dispatch a general-purpose subagent with no prior context, the
         way superpowers:requesting-code-review dispatches its final
         reviewer: no session history, only the change name, the
         working directory (the root of the repository the change
         lives in), the rule file's path and — on any run after the
         first — the previous verify.md §8 (or verify.md's path). On the capped run the
         dispatch also says "this is the capped run; base <sha>", with
         the commit the previous run recorded. The subagent applies the
         whole rule file, including its own strict validation
         (`openspec validate <change-name> --strict --json`, rule file
         section 2; check 1 stays non-strict), and returns its report in
         the rule file's section 7 format.

         Record the run in verify.md §8: the heading `Run <k>`, where k
         counts every run of check 8 on this change; under it the line
         `Runs with findings: <n> of 3`, where n counts this change's
         runs of check 8 that reported findings, this one included — a
         run reporting `No findings.` does not advance it. The run after
         n reaches 3 is the capped run, and its heading says so
         (`Run <k> — capped run`); it is past the cap, so it does not
         advance n and its line reads `3 of 3`. Then record the commit
         the run reviewed (`git rev-parse HEAD`); the result of
         `openspec validate <change-name> --strict --json` at that commit
         (`valid`, or its issue count); the report's count line; and one
         table row per finding with its file and line, its rule
         (`rule <n>` or the bold name the rule file gives), the quoted
         text, its outcome and whether it is `pre-existing`. Then clear
         every finding as the rule file's section 1 says: fix the text or
         the code, or dismiss it with a one-line reason in its row. A
         finding whose fix would change behavior a governing source
         states is not cleared here; mark its outcome as a deviation for
         check 9.

         Re-run check 8 until it reports no uncleared finding, under the
         rule file's round cap, no-repeat and `pre-existing` rules. The
         previous §8 is what makes them applicable to a subagent with no
         memory of earlier runs: its `Runs with findings` line is the
         count the cap reads, its
         dismissed rows and their quoted text are what "no repeats"
         compares against, and its recorded commit is the base of the
         capped run, which reviews only what `git diff <commit>` shows
         changed since then. The capped run's own findings are cleared
         like any other; one the controller neither fixes nor dismisses
         is marked `open — review card` and carried to the review card
         for the human, not sent into another run. Fixes made after the
         capped run are listed on the review card as not re-reviewed by
         check 8.

         Blocking: any finding that is neither fixed, dismissed, marked a
         deviation, nor carried to the review card after the cap sets
         Overall Decision to FAIL. Findings carried to the review card
         set it to PASS WITH WARNINGS, naming them.

      9. **Deviation report**: Report every point where the change
         moves away from the governing sources the adopter names. The
         adopter names them, and how to read each one (a file path, a
         URL or a command), in the `context` field that
         `openspec instructions verify --json` returns beside this
         instruction; its verify rules are the `rules` field beside it.
         Both come from `openspec/config.yaml` (`context`,
         `rules.verify`). If the context names no governing source,
         record `No governing sources configured` in verify.md §9 and
         pass this check: there is nothing to deviate from.

         Otherwise dispatch a general-purpose subagent with no prior
         context, as check 8 does — the agent that implemented the
         change leaves out what it did not think counted. Pass it the
         change name, the working directory (the root of the repository
         the change lives in), the context, the verify rules and this
         check's text. It reads:
         - each governing source at the version the adopter has
           accepted — its trunk — using the read the context gives, and
           never from a working tree or a branch that amends the source,
           including one this same work uses to amend it: a change must
           not rewrite the rules it is judged by. Record each source with
           its review status as read (for example a status field), or
           "no status stated";
         - the change's proposal, design and delta specs as they will be
           archived;
         - the diff of the change against the branch it merges into
           (`git diff <base>...HEAD`, with `<base>` the branch the change
           merges into — or, if that is not known, the merge base that
           the PRECHECK computes in its first command);
         - the executor's "Rulings I made" list, as recorded in verify.md
           §4 (and in the executor's report the controller holds), and
           every §8 and §10 finding marked `deviation — check 9`.

         A deviation is a point where the change contradicts, drops, or
         goes beyond what a governing source states — including a stated
         non-goal — so that the source would need an edit to stay true.
         Drift between the delta specs and their own first draft is not a
         deviation; only drift that also moves away from a governing
         source is. A §8 or §10 finding marked `deviation — check 9` that
         moves away from no source is not a deviation either: return it
         to the check that raised it by emptying its Outcome cell there,
         so that section's rule that an empty Outcome is uncleared holds
         Overall Decision at FAIL until that check fixes or dismisses it. The adopter's verify rules may
         narrow or widen this definition; where they say nothing, it
         holds as written. Areas the verify rules call sensitive are for
         the review card, not deviations in themselves.

         For each deviation the report gives: the source and the place in
         it; what it says; what the change does instead; why; what it
         costs if that reasoning is wrong; and the proposed edit to the
         source, in the form the verify rules say a proposed edit reaches
         its source (replacement text where they say nothing). Or it
         reports `No deviations from the governing sources.`

         Record in verify.md §9 the sources read with their review status
         as read, then the report.

         A deviation does not fail verify: whether to accept it, amend the
         source, or reverse the code is the human's decision at merge
         time, and the report is what the review card puts in front of
         them. Because they await that decision, a §9 report listing one
         or more deviations sets Overall Decision to PASS WITH WARNINGS,
         naming them. Blocking — any of these sets Overall Decision to
         FAIL: no report in §9; a deviation without its why; a governing source the
         context names that the subagent could not read (name the source
         and what the read returned).

      10. **Security pass**: Review the change's diff against the branch
         it merges into for security defects, in a fresh context. The
         diff is `git diff <base>...HEAD`, with `<base>` the branch the
         change merges into — or, if that is not known, the merge base
         that the PRECHECK computes in its first command. Only what the
         diff adds or changes is in scope; a repository-wide scan is not
         part of this check.

         Dispatch a general-purpose subagent with no prior context, as
         check 8 does: a skill loads into the turn that invokes it, so
         the verify agent never runs the review itself. Pass the
         subagent the change name, the working directory (the root of
         the repository the change lives in), `<base>` and this reading
         list: how untrusted input flows through the changed code; the trust
         boundaries it crosses; secrets and credentials written into code
         or config; injection (SQL, shell, path, template); verification
         turned off or skipped (TLS, signatures, authentication,
         authorization). Where the subagent can invoke the runtime's own
         security review — in Claude Code, the built-in
         `/security-review` — it runs that on the branch first, then
         compares the files the review says it covered with
         `git diff --name-only <base>...HEAD`. When they differ, or the
         review does not say what it covered, the subagent reviews the
         diff with the reading list itself. Otherwise it reviews the diff
         with the reading list from the start. It returns which path ran,
         a count line, then each finding with its file and line, the
         defect and the quoted code — or `No findings.`

         Record the run in verify.md §10 the way check 8 records its run
         in §8 — the `Run <k>` heading and the `Runs with findings`
         line, both counted on check 10's own runs; which path reviewed
         it; the reviewed commit; the count line — then one table row
         per finding with its file and line, the defect with the quoted code, and its
         outcome. Clear every
         finding as check 8 does: fix the code, or dismiss the finding
         with a one-line reason in its row. A finding whose fix would
         change behavior a governing source states is not cleared here:
         mark its outcome `deviation — check 9` and run check 9 again so
         its report carries it.

         Re-run check 10 until it reports no uncleared finding, under
         check 8's round cap and no-repeat rule, counted on check 10's
         own runs in §10 and read from §10 in place of §8. Whichever
         path reviewed the run, the controller drops a finding whose
         dismissed row quotes unchanged code, and on the capped run keeps
         only findings in what `git diff <commit>` shows changed, with
         `<commit>` the one the previous run recorded.

         Blocking: no report in §10, or any finding that is neither
         fixed, dismissed, marked a deviation, nor carried to the review
         card after the cap, sets Overall Decision to FAIL. Findings
         carried to the review card set it to PASS WITH WARNINGS, naming
         them.

      Verify MAY be re-run multiple times as the implementation is
      refined — each run overwrites verify.md with current state,
      except the earlier runs in §8 and §10, which are carried forward
      unchanged so the next run of check 8 or check 10 can read them.

      If `openspec-verify-change` skill is unavailable, fall back to
      running the numbered checks above manually and recording results
      in verify.md.
    requires:
      - plan

  - id: retrospective
    generates: retrospective.md
    description: Evidence-first retrospective of completed change
    template: retrospective.md
    instruction: |
      PRECHECK — verify completion evidence:
      Before producing retrospective.md, run these commands. If
      either fails, STOP and tell the user verify must pass first.

      (Substitute <change-name> in the commands below with this
      change's directory name before running them — pasted verbatim
      they match nothing and the PRECHECK fails on a passing cycle.)

      1. verify.md exists:
         test -f openspec/changes/<change-name>/verify.md

      2. verify.md's Overall Decision is NOT marked as FAIL.
         The verify.md template has 3 mutually-exclusive checkboxes
         in its "Overall Decision" section: "✅ PASS", "⚠️ PASS WITH
         WARNINGS", "❌ FAIL". Only "❌ FAIL" being checked is blocking:
         ! grep -q '^- \[x\] ❌ FAIL' openspec/changes/<change-name>/verify.md

      Only after both succeed, proceed.

      Write a retrospective of this change with evidence-first analysis.

      §3 Plan deviations MUST list every `Ruling:` the executor reported
      at apply step 2 (Superpowers 6.3.0+ rules instead of asking).
      Rulings are decisions taken on the human's behalf; this table is
      where they become reviewable after the fact — one row each, with
      the ruling's own cost-if-wrong in the Why column.

      IMPORTANT timing note:
      - retrospective.md is produced AFTER apply phase completes and
        verify.md shows no blocking issues. The `requires: [verify]`
        edge exists only for schema graph purposes; the actual
        retrospective MUST run on a completed, verified implementation.

      Process (follow these 3 steps):

      1. **Gather evidence**
         - Run `git log --oneline <base>..HEAD` in the change worktree
           (or main checkout if the worktree was already merged) to
           get the commit range
         - Read brainstorm.md, plan.md, tasks.md in this change
           directory for plan-vs-actual comparison
         - If verify.md contains failing items, address them BEFORE
           writing the retro

      2. **Write the retrospective sections** — each claim cites
         a commit hash, file path, test name, or measurable fact.

         The retrospective has §0 Evidence (quantitative front-
         matter) plus 6 analysis sections (§1–§6). Downstream
         analysis bullets reference §0 instead of inlining
         `[evidence: commit X]` per line.

         §0) **Evidence** — quantitative front-matter populated
             from `git log <base>..HEAD`, `tasks.md`, and
             verify.md: commit count, diff size (lines/files),
             tasks-done ratio, active hours, subagent dispatch
             count, new external dependencies, post-merge bugs,
             OpenSpec validate state at archive, test coverage
             signal, a one-line commit chain, and "Dismissals by
             rule": from verify.md checks 8 and 10, per rule
             (check 8) or defect kind (check 10), how many findings
             were fixed and how many dismissed, with the dismissal
             reasons grouped. "none" when neither check reported
             findings.

         §1) **Wins** — what worked well, with evidence

         §2) **Misses** — what didn't, marked by severity:
             - 🔴 blocking
             - 🟡 painful
             - 📌 nit

         §3) **Plan deviations** — tasks whose scope changed, and why

         §4) **Skill / workflow compliance** — list each skill in
             this schema's apply phase; mark whether it was
             actually used. For any ✗, fill the
             `### Deliberately Skipped Skills` subsection per the
             rules below.

         §5) **Surprises** — assumptions that turned out wrong

         §6) **Promote candidates → long-term learning** — use
             a `- [ ]` checklist (not a flat table). Each
             candidate:

             - Title with severity emoji (🔴/🟡/📌) + one-
               sentence learning
             - `→ **Promote to** <destination>` (memory /
               CLAUDE.md / schema / skill / one-off)
             - Two body lines aligned with the feedback memory
               schema: `> **Why**: <reason>` and
               `> **How to apply**: <trigger condition>`

             A rule whose findings were mostly dismissed (see the
             "Dismissals by rule" row of §0) is a promote candidate:
             sharpen or drop that rule, destination `schema`.

             Unchecked `- [ ]` items represent in-flight
             candidates that carry into the next cycle's retro
             for re-evaluation. The checklist + Why/How body
             shape lets candidates transfer mechanically to
             `~/.claude/memory/` without re-writing.

         **Skipped-skill rules for §4**:

         The schema was designed with the explicit intent that
         no apply-phase skill should be skipped — each skill is
         in the flow for a reason. Default expectation: §4 has
         every row marked ✓.

         For any skill marked ✗, DO NOT just write a one-line
         reason. Instead, the `### Deliberately Skipped Skills`
         subsection must answer three questions per skipped
         skill:

         - **What was skipped**: the specific skill or sub-step
         - **Why this cycle**: the concrete cycle condition that
           triggered the skip. Vague reasons ("not needed", "too
           small", "no time", "blocked by external dep", "output
           looked off") are insufficient — name the actual trigger
           (a specific commit hash, log line, or observed behavior).
         - **How to prevent recurrence**: which of these the
           next cycle in the same situation should rely on
           instead — schema graph fix / skill description
           tightening / CLAUDE.md trigger / scope-judgment
           rule / explicit "one-off — schema boundary case" (the
           last must state why it's a boundary, not just label
           the exception).

         If multiple cycles skip the same skill with similar
         "How to prevent" answers, that pattern is a §6 Promote
         candidate (schema / skill PR motivator). The §4
         subsection is a feedback loop into schema maintenance —
         it should make the next retro's subsection shorter, not
         longer.

      3. **Retrospective skipping policy** (different from §4
         skill skipping — this is whether to write the retro at
         all):

         - Trivial single-commit fixes: OK to skip the
           retrospective entirely. Write a one-liner reason in
           retrospective.md (e.g. "Skipped: single-commit linter
           fix, no insights").
         - Anything else: produce §0 Evidence plus all 6 analysis
           sections (a placeholder "(none observed)" is fine if
           a section truly has nothing).

      4. **Forward-pointer policy (when facts change after writing)**

         Retrospective.md reflects state at write-time. If
         subsequent cycles discover that a claim, evidence, or
         conclusion in this retro was wrong/incomplete:

         - Do NOT rewrite the retrospective (loses audit trail of
           what was known at the time)
         - Add a forward-pointer in the retrospective itself:
           `> **Update YYYY-MM-DD**: section X superseded by
           <link to follow-up retro / commit / issue>`
         - The follow-up artifact carries the corrected analysis

         Why: retrospective is evidence-based — its value is
         capturing what was known and reasoned at a specific point.
         Rewriting it removes that audit trail.

      Write output to retrospective.md using the template structure.
    requires:
      - verify

# v6 notes: subagent-driven-development (6.x) applies explicit per-dispatch
# model selection (the skill is model-agnostic — e.g. a fast, cheap model for
# mechanical steps, the most capable for reasoning) and keeps
# a durable .superpowers/sdd/ progress ledger for long runs. Both are handled
# by the executor automatically — no instruction here duplicates them.
apply:
  requires: [plan]
  tracks: tasks.md
  instruction: |
    Before implementing, set up an isolated workspace and executor:

    0. **Pre-flight — verify required Superpowers skills**:

       This schema's apply phase requires the following skills.
       Confirm each appears in your available skills list before
       proceeding:

       - superpowers:using-git-worktrees
       - superpowers:subagent-driven-development
       - superpowers:test-driven-development (the discipline the
         plan's test-first steps follow; SDD does not load it itself)
       - superpowers:requesting-code-review (its reviewer prompt runs
         SDD's final whole-branch review)
       - superpowers:finishing-a-development-branch

       If any required skill is missing, STOP and inform the user —
       do NOT proceed and do NOT silently fall back to manual
       implementation. The user can install the Superpowers plugin,
       or explicitly opt into the manual fallback path described at
       the end of this instruction.

       One further skill is consumed later in this phase and is NOT a
       STOP: `openspec-verify-change` at step 3, which has a documented
       manual fallback (run verify's numbered checks by hand). Note its
       absence as a WARNING at apply start rather than discovering it at
       step 3, and record the fallback in the retrospective's
       skipped-skill section — it is listed in that table precisely
       because it is the skip most likely to actually happen.

       Additionally, confirm the project's expected CLI tools are
       on PATH. The exact list depends on the project — read
       plan.md and surface any tool mentioned (e.g., `mvn`/`mvnw`,
       `docker`, `python3`, `jq`, `glab`/`gh`, `node`/`npm`). If
       a tool is missing, surface as WARNING (not STOP) — the user
       may have a fallback. Print the missing list once at apply
       start so the user isn't surprised mid-cycle.

    1. **Workspace**: Use the Skill tool to invoke
       **superpowers:using-git-worktrees** to create an isolated
       git worktree for this change.

    2. **Executor — subagent-driven-development**:

       Use the Skill tool to invoke
       **superpowers:subagent-driven-development** to execute
       the plan.md micro-tasks with fresh subagents per task.

       Tell the executor:
       - Read plan.md in this change directory for micro-tasks
       - Tick BOTH committed ledgers IN THE SAME bookkeeping message
         where you append the SDD progress-ledger line for a cleared
         task. When a task's review comes back clean, do all three
         together: flip its `- [ ]` to `- [x]` in
         openspec/changes/<name>/tasks.md, flip that task's step boxes
         in openspec/changes/<name>/plan.md, AND append the ledger
         line. Treat "the ledger step" as covering all three — a rule
         written for only one of the two committed files gets followed
         for that one and missed for the other.
         Both .md files are committed sources of truth that travel in
         the PR diff; the SDD ledger is throwaway per-worktree scratch.
         Each un-ticked file fails differently, and neither failure
         announces itself as bookkeeping:
         - An all-unchecked tasks.md makes the verify PRECHECK below
           falsely STOP.
         - An unmaintained plan.md silently disarms verify §7. That
           check reads plan.md for `[~]` deferred rows, so a manual /
           dogfood step actually deferred during apply is never marked
           `[~]` — §7 then renders legitimately blank and reports "no
           deferrals" for a cycle that had them, which is exactly the
           "deferred-and-gapped" case §7 exists to surface at archive.
         So when you defer a step rather than clear it, mark it `[~]`
         in plan.md at that moment; `[~]` is what verify §7 consumes.
       - Work within the created worktree
       - STOP after the final whole-branch review passes. Do NOT invoke
         superpowers:finishing-a-development-branch and do NOT remove or
         clean up the worktree — this bridge runs the finish sequence
         itself at apply step 6, and the worktree + SDD ledger must
         survive for steps 3-5 (verify / retrospective / archive).
         Return control to the apply controller after the final review;
         report the commit range and the ledger path.
       - Rulings (Superpowers 6.3.0+): subagent-driven-development no
         longer stops to ask on plan conflicts, ambiguities or plan
         defects — it rules, records `Ruling: <what> — <why> — <cost if
         wrong>` in its ledger, and continues, stopping only for the
         four classes it names (irreversible or destructive operations,
         security-sensitive actions, side effects outside the worktree
         such as merge / push / publish, and a plan where every path
         forward is a guess). It normally emits its exhaustive "Rulings
         I made" list at the moment it deletes its workspace — the very
         step this bridge suppresses. So: include the complete "Rulings
         I made" list in the report back to the apply controller, in
         the order made, each with what it costs if wrong. A ruling
         that dies with the ledger was a decision made in secret. The
         controller hands that list to verify (check 4) and the
         retrospective (§3).
       - The comment rule, as a backup to plan.md's Global Constraints,
         which carry it to every implementer brief and the task
         reviewer: code comments, docstrings and messages state the
         reason in words. They cite no planning labels — design
         decisions (D9), task or step numbers (Task 5, Step 2), review
         fix tags (FIX-2) or change-folder files (design.md, plan.md).
         Where a comment needs its source, it names the change:
         "decision D9 of the change <change-name>". Commit messages
         carry the trace. Apply it to every brief you dispatch,
         including the ones plan.md does not carry, such as the fix
         rounds of step 3.
       - Stop and ask the human before any action that the adopter's
         safety rules (from `rules.plan`, carried in plan.md's Global
         Constraints) or its apply guidance (the `operationGuidance`
         field that `openspec instructions apply --json` returns beside
         this instruction, from `operations.apply.guidance` in
         `openspec/config.yaml`) reserve for a human — in addition to
         the four stop classes above. The apply guidance is not in
         plan.md, so add it to every brief you dispatch; and add
         plan.md's Global Constraints to every brief plan.md does not
         carry, such as the fix rounds of step 3. An implementer
         reports BLOCKED rather than perform an action either reserves
         for a human. These are not rulings: the controller asks the
         human rather than rules, and holds to the same stop for the
         actions it takes itself, such as the push at step 6. With no
         safety rules and no apply guidance, the four classes are the
         whole stop rule. Rules about the content of code (no secret
         values, no disabled certificate check) are better enforced
         by a deterministic check the runtime runs on every edit, such
         as a pattern hook; which check, if any, is the adopter's
         configuration, not this bundle's.

       IMPORTANT — where TDD and code review come from:
       you do NOT invoke either skill manually here.
       - **TDD comes from the plan, not from the executor.**
         subagent-driven-development does not load
         superpowers:test-driven-development (its SKILL.md has not
         named it since Superpowers 6.2.0); its implementer prompt
         says "Write tests (following TDD if task says to)". Each
         task says to: the plan artifact requires every behavior
         task to open with a failing-test step and a run-it-to-fail
         step. The implementer reports RED and GREEN evidence for
         such a task, and the merged task reviewer reads that
         evidence. So hand plan.md to the executor as written — a
         task whose test-first steps are dropped or reordered loses
         TDD silently.
       - **superpowers:requesting-code-review** — its reviewer prompt
         (code-reviewer.md) runs the FINAL whole-branch review before
         apply concludes. Per-task review is handled INSIDE
         subagent-driven-development by its own merged task-reviewer
         prompt (spec compliance + code quality), not by a separate
         skill invocation.

       NOTE: subagent-driven-development's own flow ends by invoking
       finishing-a-development-branch + worktree cleanup; under THIS
       bridge that terminal step is SUPPRESSED (see the executor
       instruction above) because the bridge sequences finish itself
       at apply step 6. There is no native flag to disable it, so the
       suppression is by instruction.

       This schema does NOT support `superpowers:executing-plans`
       as a fallback for non-subagent platforms. TDD is not the
       reason: per its SKILL.md (Superpowers 6.4.1+), executing-plans
       loads test-driven-development itself (SDD relies on the plan
       for it), loads verification-before-completion and ends with
       one fresh whole-branch review. The reason is that the executor
       implements every task itself in one context, with no reviewer
       per task — it gives up exactly the fresh context per task and
       the per-task review gate this apply phase is built on.
       If your platform lacks subagent support, use the built-in
       `spec-driven` schema instead of this one.

    3. **Verification**: When all tasks are done, produce the
       `verify` artifact by invoking **openspec-verify-change**
       to check completeness, correctness, and coherence.
       Re-run verify until all blocking issues are resolved.

       The review loop — checks 8 (spec review) and 10 (security pass)
       raise findings that the controller clears, not the human:
       - Clear every finding the way the check says: fix it, dismiss it
         with a one-line reason in its row, or mark it
         `deviation — check 9` when its fix would change behavior a
         governing source states. A deviation marked by check 10 means
         check 9 runs again, because check 9 runs before check 10 and
         its report must carry it.
       - Make the fixes through the executor's normal flow — an
         implementer subagent with the findings as its brief, which
         commits its work as any task does — so that the tree is
         committed before the check runs again: each run records the
         commit it reviewed, and the capped run's base is the commit
         the previous run recorded. After a fix round, run check 5
         again; the fixes changed files after it was recorded.
       - Re-run the check until it reports no uncleared finding, under
         the rule file's round cap: each run is headed `Run <k>`, k
         counting every run of that check, and its line
         `Runs with findings: <n> of 3` counts that check's runs that
         reported findings. The run after n reaches 3 is the capped
         run, headed `Run <k> — capped run`; it reviews only what
         changed since the previous run's recorded commit. A finding
         still open after the capped run is marked `open — review card`, sets Overall
         Decision to PASS WITH WARNINGS rather than FAIL, and goes to
         the human on the review card instead of into another run.
         Fixes made after the capped run go on the card as not
         re-reviewed.

       When verify has no blocking issue left, fill verify.md's
       `## Review Card` from its sections, so the card is committed
       with verify.md and travels into the archive with it; step 6
       puts it in front of the human. Each of its six parts says what
       goes in it. "What the checks did not cover" is yours to derive:
       the sensitive areas the adopter's verify rules (`rules.verify`)
       name that the diff touches, every check verify did not run or
       ran on a fallback path (for example check 10's `Reviewed by`
       naming the reading list, or verify's checks run by hand), the
       findings marked `open — review card`, and the fixes made after
       a capped run. A part with nothing to list says so in words; an
       empty part reads as unchecked.

       A PASS verify is mid-cycle, not an endpoint: steps 4–5
       (retrospective, archive) gate the PR/MR (step 6) and must
       land on the same branch — if the session ends after verify,
       the next session picks up at step 4, not at the merge button.

    4. **Retrospective (write while context is hot)**:

       Once verify.md shows no blocking issues, produce the
       `retrospective` artifact BEFORE opening any PR. Run the
       retrospective artifact's instruction (which has its own
       PRECHECK confirming verify.md exists and is not FAIL).

       Why now, not after PR: retrospective is part of this cycle's
       deliverables and should land in the same PR. Writing it after
       PR merge produces a separate trailing commit and loses the
       hot context (running tests, fresh fix memory).

    5. **Archive (sync spec delta + move folder)**:

       After retrospective.md is written, run `openspec archive -y`
       (or invoke `/opsx:archive`). This:
       - syncs delta specs from `openspec/changes/<name>/specs/`
         into `openspec/specs/<capability>/spec.md`
       - moves the change folder to
         `openspec/changes/archive/YYYY-MM-DD-<name>/`

       The PR diff after archive contains the COMPLETE cycle state:
       all 8 artifacts done, spec synced into main specs, change
       under archive/.

    6. **Completion (finish + push is the LAST automated step)**:

       After retrospective + archive are both done, use the Skill
       tool to invoke **superpowers:finishing-a-development-branch**.
       In Superpowers 6.2.0+ (re-attested at 7.0.0) finishing re-runs
       the full test suite on
       the tree being integrated, confirms the base branch, and
       presents merge / push / keep options (discard exists only as a
       response to an explicit request); on the push option it pushes
       the branch AND creates the MR/PR via the forge CLI (gh /
       glab), reporting the URL. Creating the MR/PR this way is
       sanctioned. Merging is not: NEVER merge or arm auto-merge —
       the merge button belongs to your human partner.

       The review card goes at the top of the PR/MR description: the
       `## Review Card` section of verify.md (now under the archived
       change folder), as filled at step 3. Give it to finishing as
       the opening of the description; if finishing created the
       request without it, edit the description afterwards with the
       forge's CLI (`gh pr edit`, `glab mr update`). The card is a view
       of verify.md, which stays the record. If the card is still
       unfilled, STOP and complete it before the push: fill it in
       verify.md as step 3 says, and get it onto the branch. This
       bundle posts no inline review comments; the forge's own review
       tools stay the human's.

       The pushed branch MUST contain the complete archived cycle
       (all 8 artifacts, specs synced, change under archive/). If it
       doesn't (e.g., retrospective or archive was skipped), STOP and
       complete those first.

       This is the canonical finish sequence — do NOT reorder.
